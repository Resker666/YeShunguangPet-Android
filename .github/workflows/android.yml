name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk YeShunguangPet-Android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: YeShunguangPet-Android-debug
          path: YeShunguangPet-Android-debug.apk
          if-no-files-found: error
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify the side-by-side APK starts on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          emulator-boot-timeout: 300
          script: |
            adb install YeShunguangPet-Android-debug.apk
            adb shell am start -W -n com.resker666.yeshunguangpet.preview/com.resker666.yeshunguangpet.MainActivity
            adb shell pidof com.resker666.yeshunguangpet.preview
