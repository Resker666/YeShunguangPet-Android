name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk YeShunguangPet-Android-v0.1.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: YeShunguangPet-Android-debug
          path: YeShunguangPet-Android-v0.1.0-debug.apk
          if-no-files-found: error
