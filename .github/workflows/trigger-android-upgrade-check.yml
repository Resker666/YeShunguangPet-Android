name: Dispatch Android upgrade acceptance
on:
  push:
    branches:
      - test/android-release-dispatch
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger the manual upgrade mode on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-release.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=upgrade-test
